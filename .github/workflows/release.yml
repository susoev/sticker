# Каждый push в main: сборка установщика на Windows и публикация релиза.
# Установленные копии Sticker сами находят новый релиз и обновляются.
name: release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'test/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Версия = 1.1.<номер запуска>; руками менять не нужно.
      - name: Set version
        shell: bash
        run: npm version "1.1.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run dist

      # Релиз с тремя файлами: установщик, blockmap и latest.yml (по нему программа находит обновление).
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          V=$(node -p "require('./package.json').version")
          ls -la dist
          gh release create "v$V" dist/*.exe dist/*.blockmap dist/latest.yml \
            --title "v$V" --notes "${NOTES:-Сборка $V}" --target "${{ github.sha }}"
